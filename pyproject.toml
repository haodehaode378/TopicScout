[project]
name = "topic-scout"
version = "0.1.0"
description = "Personal research agent — keyword → AI refinement → deep crawl → Notion-style UI → PDF/JSON export"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.10.0",
    "sse-starlette>=2.2.0",
    "markdown>=3.8",
    "ddgs>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
]

[project.scripts]
topic-scout = "topic_scout.__main__:main"

[tool.setuptools.packages.find]
include = ["topic_scout*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
